spring:
  application:
    name: finflow-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/finflow_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  redis:
    host: localhost
    port: 6379

server:
  port: 8080
