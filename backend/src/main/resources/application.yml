server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finflow_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate: 
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.springframework.boot: INFO
    com.finflow: DEBUG
