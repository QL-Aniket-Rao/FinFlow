spring:
  datasource:
    url: jdbc:postgresql://db:5432/mydb
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  redis:
    host: redis
    port: 6379
  security:
    # Placeholder for Spring Security configuration
    enabled: true

server:
  port: 8080
