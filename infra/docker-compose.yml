version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    container_name: finflow_backend
    ports:
      - "8080:8080"
    environment:
      # Note: In a real scenario, these should point to the service names defined in docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finflow_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    restart: on-failure

  frontend:
    build: 
      context: ../frontend
      dockerfile: Dockerfile
    container_name: finflow_frontend
    ports:
      - "3000:80" # Mapping host 3000 to container 80
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
